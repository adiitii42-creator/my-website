<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
table {
  width: 100%;
}

table, th, td {
  border:1px solid #ddd;  
  border-collapse: collapse;
  padding: 8px;
  text-align: left;
}

th:nth-child(even), td:nth-child(even) {
  background-color: #D6EEEE;
}
</style>
<body>
  <h2>Vertical Striped Table</h2>
<p>To make a vertical zebra-striped table, style every other column, instead of every other row:</p>

<table>
  <tr>
  <th>First Name</th>
  <th>Last Name</th>
  <th>Age</th>
  <th>Savings</th>  
  </tr>
  <tr>
  <td>Peter</td>
  <td>Griffin</td>
  <td>23</td>  
  <td>$100</td>
  </tr>
  <tr>
  <td>Lois</td>
  <td>Griffin</td>
  <td>19</td>
  <td>$150</td>
  </tr>
  <tr>
  <td>Joe</td>
  <td>Swanson</td>
  <td>28</td>
  <td>$300</td>
  </tr>
  <tr>
  <td>Cleveland</td>
  <td>Brown</td>
  <td>21</td>
  <td>$250</td>
  </tr>
</table>  
</body>
</html>
